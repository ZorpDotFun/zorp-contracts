[profile.default]
src = "src"
out = "out"
libs = ["lib", "../example/contractsV2/lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arc = "https://rpc.arc-scan.org"

# Arcscan (https://arc-scan.org) and Sourcify both accept 5042.
# forge verify-contract <addr> src/LaunchToken.sol:LaunchToken --chain 5042 --verifier sourcify
[etherscan]
arc = { key = "${ARCSCAN_API_KEY}", url = "https://api.arc-scan.org/api", chain = 5042 }
